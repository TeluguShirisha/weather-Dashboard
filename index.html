<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌤 Weather Dashboard</h1>

    <p id="dateTime"></p>

    <div class="search-box">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name..."
        >
        <button id="searchBtn">Search</button>
    </div>

    <div id="loading" class="loading">
        Loading weather...
    </div>

    <div id="error" class="error"></div>

    <div id="weatherCard" class="weather-card">

        <h2 id="cityName"></h2>

        <img id="weatherIcon" alt="weather">

        <h1 id="temperature"></h1>

        <p id="description"></p>

        <div class="details">

            <div class="card">
                <h3>💧 Humidity</h3>
                <p id="humidity"></p>
            </div>

            <div class="card">
                <h3>🌬 Wind</h3>
                <p id="wind"></p>
            </div>

            <div class="card">
                <h3>🌡 Feels Like</h3>
                <p id="feelsLike"></p>
            </div>

            <div class="card">
                <h3>📊 Pressure</h3>
                <p id="pressure"></p>
            </div>

            <div class="card">
                <h3>👀 Visibility</h3>
                <p id="visibility"></p>
            </div>

            <div class="card">
                <h3>🌅 Sunrise</h3>
                <p id="sunrise"></p>
            </div>

            <div class="card">
                <h3>🌇 Sunset</h3>
                <p id="sunset"></p>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
